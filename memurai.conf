# Stemora project-local Memurai dev config.
#
# Used because the stock C:\Program Files\Memurai\memurai.conf is not editable
# without elevation, and launching memurai.exe with no config left `dir ./`
# pointing at the repo root — an OneDrive-managed Documents folder where RDB
# snapshots failed intermittently. With the stock setting
# `stop-writes-on-bgsave-error yes` that turn offline writes and BullMQ spun in
# a MISCONF retry loop.
#
# Start:   "C:\Program Files\Memurai\memurai.exe" <this file>
# Verify:  "C:\Program Files\Memurai\memurai-cli.exe" ping      (expect PONG)
# Stop:    "C:\Program Files\Memurai\memurai-cli.exe" shutdown nosave

port 6379
bind 127.0.0.1
protected-mode yes

# Data + logs live OUTSIDE the repo so snapshots never touch the worktree.
# Edit this to your own writable path if it doesn't exist on your machine, and
# keep it out of any cloud-synced folder (OneDrive/Dropbox) for the reason above.
dir C:/Users/maina/memurai-data
dbfilename dump.rdb
logfile memurai-log.txt

# A failed snapshot logs an error instead of disabling writes. Availability
# beats durability for this ephemeral <=24h job-queue cache (job records are
# fully rebuildable).
stop-writes-on-bgsave-error no

# Keep snapshotting gentle (drop the aggressive `60 10000` default) so BullMQ
# churn does not fork a child every minute.
save 3600 1
save 300 100